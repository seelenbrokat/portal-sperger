# Timocom Freight Monitor – HTML-Hub unter /opt/timocom-freight-monitor/data
# Getrennt von Sperger-Portal und WOG
# Auth: HTTP Basic (Datei /etc/nginx/.htpasswd-timo – nicht im Git)

server {
    listen 80;
    listen [::]:80;
    server_name timo.logistikberater.at;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timo.logistikberater.at;

    ssl_certificate /etc/letsencrypt/live/timo.logistikberater.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timo.logistikberater.at/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Timocom Freight Monitor";
    auth_basic_user_file /etc/nginx/.htpasswd-timo;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/timocom-freight-monitor/data;
    index index.html;

    # Filter-API (Ausblenden / Watchlist) → lokaler Flask im Monitor-Prozess
    location /api/ {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.log$ {
        deny all;
    }

    location ~* \.xlsx$ {
        add_header Content-Disposition "attachment";
    }
}
