# Timocom Freight Monitor – HTML-Hub unter /opt/timocom-freight-monitor/data
# Getrennt von Sperger-Portal und WOG

server {
    listen 80;
    listen [::]:80;
    server_name timo.logistikberater.at;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timo.logistikberater.at;

    ssl_certificate /etc/letsencrypt/live/timo.logistikberater.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timo.logistikberater.at/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/timocom-freight-monitor/data;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Excel-Downloads erlauben, Logs nicht öffentlich
    location ~* \.log$ {
        deny all;
    }

    location ~* \.xlsx$ {
        add_header Content-Disposition "attachment";
    }
}
